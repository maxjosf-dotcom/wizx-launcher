<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://textures.minecraft.net https://cdn.modrinth.com; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WizX Client</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>

  <div id="titlebar">
    <div class="tb-brand"><img src="logo.svg" alt="" width="18" height="18"><span>WizX Client</span></div>
    <div class="tb-ctrl">
      <button data-action="win" data-w="min" aria-label="Minimieren"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button data-action="win" data-w="max" aria-label="Maximieren"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button data-action="win" data-w="close" class="close" aria-label="Schliessen"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <div id="app">
    <aside id="sidebar">
      <div class="brand"><img src="logo.svg" alt="" width="46" height="46"><div><b>WizX</b><small>Client</small></div></div>
      <nav id="nav"></nav>
      <div class="side-sep"></div>
      <div class="side-title">Zuletzt gespielt</div>
      <div id="recent"></div>
      <div class="grow"></div>
      <div id="side-acc"></div>
    </aside>

    <section id="main">
      <header id="topbar">
        <label class="search" id="search-wrap"></label>
        <div class="grow"></div>
        <div id="top-acc"></div>
      </header>
      <div id="view"></div>
    </section>
  </div>

  <footer id="statusbar">
    <div class="st-left"><span id="st-text">Bereit</span><div class="bar" id="st-bar"><i id="st-fill"></i></div><span id="st-pct"></span></div>
    <div class="st-right"><span id="st-mem"></span><span id="st-upd"></span><span id="st-ver"></span></div>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="app.js"></script>
</body>
</html>
